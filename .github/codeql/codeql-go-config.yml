name: "Quark CodeQL config — Go"

query-filters:
  # go/request-forgery: fetchURL in pkg/util/updateutil/updateutil.go contacts only
  # an explicit allowlist of hosts (github.com, objects.githubusercontent.com, Azure
  # blob). Scheme enforced to https; request host replaced with the allowlist
  # constant before the HTTP call is made. Alert #8 confirmed and dismissed.
  - exclude:
      id: go/request-forgery

  # go/path-injection: all user-supplied paths in storageutil, vfs, and the API
  # handlers flow through safeJoin(filesDir, userPath) which validates that the
  # joined path stays within the device's FilesDir. CodeQL cannot model this
  # custom containment check as a sanitizer, producing ~55 false-positive alerts.
  # The same pattern applies to extract.go (filepath.Clean + HasPrefix check).
  - exclude:
      id: go/path-injection

  # go/disabled-certificate-check: the TLS skip in remoteutil is on the loopback
  # Tailscale→local reverse proxy connection. The quark presents its own self-signed
  # cert and the hop is to itself — there is no external party to authenticate and
  # no CA that could vouch for the cert. Alert #91.
  - exclude:
      id: go/disabled-certificate-check

  # go/weak-sensitive-data-hashing: hashToken in pkg/util/authutil/service.go hashes
  # session tokens and auth keys, which are 32 random bytes (the key is the output of
  # Argon2id on the client). A slow password hash adds nothing to a high-entropy
  # secret and Basic auth pays for the hash on every request (#2765). HashKey refuses
  # anything not shaped like a key, so a chosen password is never stored under it;
  # those go through bcrypt. Alert #119.
  - exclude:
      id: go/weak-sensitive-data-hashing
