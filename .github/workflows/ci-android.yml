name: CI - Android
on:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status".
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  ci-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # build/frontend/android takes the app version from the most recent tag, and
          # the default checkout is shallow with no tags. Without these the version
          # silently falls back to Flutter's 1.0.0 default.
          fetch-tags: true
          fetch-depth: 0
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Run unit tests
        run: |
          make test/unit/frontend
      - name: Build [android]
        run: |
          make build/frontend/android
