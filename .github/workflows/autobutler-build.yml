name: Build
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  autobutler-build:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install Node dependencies
        run: |
          npm ci --prefix ./app
      - name: Build
        run: |
          make build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/autobutler
          if-no-files-found: error
      - name: Check backend cross-compile [darwin/arm64]
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          make build/backend
      - name: Check backend cross-compile [linux/arm64]
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          make build/backend
  autobutler-build-test:
    uses: ./.github/workflows/autobutler-test.yml
    needs:
      - autobutler-build
    with:
      is-remote: false
      run-id: ${{ needs.autobutler-build.outputs.run-id }}

