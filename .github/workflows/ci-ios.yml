name: CI - iOS
on:
  # Also on push to main so the badges have a run attributed to the branch. Without it
  # every run belongs to a pull request's head ref and a ?branch=main badge reads
  # "no status".
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  ci-ios:
    # macOS runners bill at a multiple of Linux minutes, so this job is deliberately
    # narrow: build the App Store IPA and let check/frontend/ios/ipa verify it is a real
    # release build. No upload -- nothing here consumes an App Store build number.
    runs-on: macos-26
    timeout-minutes: 45
    # Signing secrets are not exposed to pull requests from forks, so the job would fail
    # for reasons a contributor cannot fix. Skip it there rather than show a red X.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The app version comes from the most recent tag, and the default checkout is
          # shallow with no tags, so git describe would find nothing.
          fetch-tags: true
          fetch-depth: 0
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup GNU make
        uses: ./.github/actions/setup-gnu-make
      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: Prepare code signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/ios-ci-signing.bash
      - name: Build [ios]
        # Fixed build number: this job verifies the build and never uploads, so it has no
        # App Store Connect credentials to query the real next number with.
        run: |
          make build/frontend/ios/ipa \
            IOS_EXPORT_OPTIONS=ios/ExportOptions.ci.plist \
            IOS_BUILD_NUMBER=1
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-ci
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles
          rm -rf ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          rm -f ios/ExportOptions.ci.plist
          security delete-keychain ~/Library/Keychains/quark-signing.keychain-db || true
          git checkout -- ios/Flutter/Release.xcconfig || true
