name: CI
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Build
        run: |
          make build/backend
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/quark
          if-no-files-found: error
      - name: Check backend cross-compile [darwin/arm64]
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          make build/backend
      - name: Check backend cross-compile [linux/arm64]
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          make build/backend
      - name: Run unit tests
        env:
          PRINT_COVERAGE: true
        run: |
          make test/unit/backend
      - name: Run integration tests
        run: |
          make test/integration/backend
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Setup Node
        uses: ./.github/actions/setup-node
      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Run unit tests
        run: |
          make test/unit/frontend
      - name: Build [web]
        run: |
          make build/frontend/web
      - name: Build [android]
        run: |
          make build/frontend/android
  ios-changes:
    # Gate ci-ios on whether anything that can affect the iOS build actually changed.
    # Most pull requests here are dependency bumps that cannot touch it, and a macOS
    # runner bills at roughly 10x a Linux one.
    #
    # This is a job-level gate rather than an `on.pull_request.paths` filter because a
    # workflow-level filter would suppress ci-backend and ci-frontend too, and would
    # leave any required status check pending forever instead of reporting skipped.
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect iOS-relevant changes
        id: filter
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "Not a pull request -- building unconditionally."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "Changed files:"
          echo "$changed"
          # lib, assets and packages are compiled into the app; Makefile carries the
          # build target; pubspec pins the Flutter SDK and every dependency.
          pattern='^(ios/|lib/|assets/|packages/|pubspec\.(yaml|lock)$|Makefile$|scripts/ios-|\.github/workflows/ci\.yml$)'
          if grep -qE "$pattern" <<< "$changed"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "iOS-relevant changes found; ci-ios will run."
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
            echo "No iOS-relevant changes; skipping ci-ios."
          fi
  ci-ios:
    # macOS runners bill at a multiple of Linux minutes, so this job is deliberately
    # narrow: build the App Store IPA and let check/frontend/ios/ipa verify it is a real
    # release build. No upload -- nothing here consumes an App Store build number.
    needs: ios-changes
    runs-on: macos-15
    timeout-minutes: 45
    # Signing secrets are not exposed to pull requests from forks, so the job would fail
    # for reasons a contributor cannot fix. Skip it there rather than show a red X.
    if: >-
      needs.ios-changes.outputs.ios == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: Prepare code signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: ./scripts/ios-ci-signing.bash
      - name: Build [ios]
        run: |
          make build/frontend/ios/ipa IOS_EXPORT_OPTIONS=ios/ExportOptions.ci.plist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-ci
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean up signing material
        if: always()
        run: |
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles
          rm -f ios/ExportOptions.ci.plist
