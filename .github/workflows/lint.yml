name: Lint
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix ./app
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Generate code
        run: |
          make generate
      - name: Lint
        run: |
          make lint
      - name: Tidy
        run: |
          go mod tidy
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "There are uncommitted changes after linting and generating. Please fix them before committing.";
            exit 1;
          fi
