name: Build Raspberry Pi Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-pi-images:
    name: Build AutoButler Pi Images
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx curl jq qemu-user-static

      - name: Build Pi 4 image
        run: sudo ./os/build-image.sh pi4

      - name: Build Pi 5 image
        run: sudo ./os/build-image.sh pi5

      - name: Generate checksums
        run: |
          cd os
          sha256sum autobutler-pi4.img.xz autobutler-pi5.img.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autobutler-pi-images
          path: |
            os/autobutler-pi4.img.xz
            os/autobutler-pi5.img.xz
            os/SHA256SUMS.txt

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            os/autobutler-pi4.img.xz \
            os/autobutler-pi5.img.xz \
            os/SHA256SUMS.txt \
            --clobber
