name: Test
on:
  workflow_dispatch:
    inputs:
      is-remote:
        description: Whether or not we are testing a remote instance
        type: boolean
        default: false
      remote-url:
        description: The URL where the application is hosted for end-to-end testing
        type: string
        default: https://autobutlerdemo.azurewebsites.net
        required: false
      run-id:
        description: The run ID of the workflow to download the release from
        type: string
        default: ''
        required: false
  workflow_call:
    inputs:
      is-remote:
        description: Whether or not we are testing a remote instance
        type: boolean
        default: false
      remote-url:
        description: The URL where the application is hosted for end-to-end testing
        type: string
        default: https://autobutlerdemo.azurewebsites.net
        required: false
      run-id:
        description: The run ID of the workflow to download the release from
        type: string
        default: ''
        required: false
env:
  BASE_URL: ${{ inputs.is-remote && inputs.remote-url || 'http://localhost:8080' }}
jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Download release
      if: ${{ !inputs.is-remote }}
      uses: actions/download-artifact@v7
      with:
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install Node dependencies
      run: |
        npm ci --prefix ./app
    - name: Install Playwright Browsers
      run: |
        make setup/playwright
    - name: Start Autobutler
      if: ${{ !inputs.is-remote }}
      run: |
        ls -la
        chmod +x ./autobutler
        ./autobutler serve &
    - name: Run E2E tests
      run: |
        make test/e2e
    - uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
  test-unit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install Node dependencies
      run: |
        npm ci --prefix ./app
    - name: Run unit tests
      env:
        PRINT_COVERAGE: true
      run: |
        make test/unit
    - name: Print Coverage
      run: |
        echo "```" >> ${GITHUB_STEP_SUMMARY}
        go tool cover -func=./coverage.out.ignored >> ${GITHUB_STEP_SUMMARY}
        echo "```" >> ${GITHUB_STEP_SUMMARY}
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-coverage
        path: coverage.*
