name: CI
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  autobutler-ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Setup sqlc
        uses: ./.github/actions/setup-sqlc
      - name: Setup swag
        uses: ./.github/actions/setup-swag
      - name: Build
        run: |
          make build/backend
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/autobutler
          if-no-files-found: error
      - name: Check backend cross-compile [darwin/arm64]
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          make build/backend
      - name: Check backend cross-compile [linux/arm64]
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          make build/backend
      - name: Run unit tests
        env:
          PRINT_COVERAGE: true
        run: |
          make test/unit/backend
      - name: Run integration tests
        run: |
          make test/integration/backend
  autobutler-ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Tidy
        run: |
          make tidy/flutter
      - name: Run unit tests
        run: |
          make test/unit/frontend
      - name: Build [web]
        run: |
          make build/frontend/web
      - name: Build [android]
        run: |
          make build/frontend/android
  autobutler-ci-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - odroid-n2
          - pi4
          - pi5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Cache Packer plugins
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.home }}/.packer.d
          key: packer-plugins-${{ runner.os }}-${{ hashFiles('os/autobutler.pkr.hcl') }}
          restore-keys: |
            packer-plugins-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx curl jq qemu-user-static unzip

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: '1.15.2'

      - name: Packer init (downloads plugins)
        run: |
          cd os
          packer init ./autobutler.pkr.hcl

      - name: Verify Packer configuration
        run: |
          cd os
          packer validate -var "board=${{ matrix.target }}" ./autobutler.pkr.hcl

      - name: Build image [${{ matrix.target }}]
        run: |
          cd os
          packer build -only=${{ matrix.target }} ./autobutler.pkr.hcl

      - name: Verify image artifacts [${{ matrix.target }}]
        run: |
          cd os
          ls -lh autobutler-${{ matrix.target }}.img.xz* || exit 1
