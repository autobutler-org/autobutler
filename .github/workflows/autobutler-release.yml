name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Single packer target to build (e.g. pi4, pi5). Empty builds all targets.'
        required: false
        default: ''
defaults:
  run:
    shell: bash

env:
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  WORKING_DIR: ${{ github.workspace }}

jobs:
  autobutler-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in the format vX.Y.Z"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build frontend [web]
        env:
          FLUTTER_BUILD_MODE: release
        run: |
          make build/frontend/web
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: ~> v2
          args: release --clean
          workdir: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: autobutler-release
          path: ${{ env.WORKING_DIR }}/dist/*

  build-pi-images:
    name: Build Raspberry Pi Images
    needs: autobutler-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        target: [pi4, pi5, odroid-n2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Cache Packer plugins
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.home }}/.packer.d
          key: packer-plugins-${{ runner.os }}-${{ hashFiles('os/autobutler.pkr.hcl') }}
          restore-keys: |
            packer-plugins-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx curl jq qemu-user-static unzip

      - name: Setup Packer
        uses: hashicorp/setup-packer@v2
        with:
          packer_version: '1.9.5'

      - name: Verify Packer
        run: packer version

      - name: Packer init (downloads plugins)
        run: |
          cd os
          packer init ./autobutler.pkr.hcl

      - name: Build image (per target)
        if: ${{ github.event.inputs.target == '' || matrix.target == github.event.inputs.target }}
        run: |
          cd os
          # Build only the selected target; force re-use and fail fast on error
          packer build -force -only=${{ matrix.target }} ./autobutler.pkr.hcl

      - name: List produced artifacts
        if: ${{ github.event.inputs.target == '' || matrix.target == github.event.inputs.target }}
        run: |
          cd os
          ls -lh *.img* || true

      - name: Generate checksum (per target)
        if: ${{ github.event.inputs.target == '' || matrix.target == github.event.inputs.target }}
        run: |
          cd os
          # find produced xz for this target pattern and checksum it
          IMG=$(ls *${{ matrix.target }}*.img.xz 2>/dev/null || true)
          if [ -z "$IMG" ]; then
            echo "No image found for target ${{ matrix.target }}"
            exit 1
          fi
          sha256sum "$IMG" > "SHA256SUM-${{ matrix.target }}.txt"
          cat "SHA256SUM-${{ matrix.target }}.txt"

      - name: Upload image artifact
        if: ${{ github.event.inputs.target == '' || matrix.target == github.event.inputs.target }}
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: |
            os/*${{ matrix.target }}*.img.xz
            os/SHA256SUM-${{ matrix.target }}.txt

      - name: Attach images to release
        if: ${{ github.event.inputs.target == '' || matrix.target == github.event.inputs.target }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd os
          gh release upload "${{ github.ref_name }}" --clobber *${{ matrix.target }}*.img.xz SHA256SUM-${{ matrix.target }}.txt || true

      - name: Notify skipped
        if: ${{ github.event.inputs.target != '' && matrix.target != github.event.inputs.target }}
        run: |
          echo "Matrix target ${{ matrix.target }} skipped because workflow_dispatch target was set to ${{ github.event.inputs.target }}"
