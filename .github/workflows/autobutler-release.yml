name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
defaults:
  run:
    shell: bash

env:
  AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
  WORKING_DIR: ${{ github.workspace }}

jobs:
  autobutler-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must be in the format vX.Y.Z"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
      - name: Build frontend [web]
        env:
          FLUTTER_BUILD_MODE: release
        run: |
          make build/frontend/web
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: ~> v2
          args: release --clean
          workdir: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: autobutler-release
          path: ${{ env.WORKING_DIR }}/dist/*

  build-pi-images:
    name: Build Raspberry Pi Images
    needs: autobutler-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx curl jq qemu-user-static

      - name: Build Pi 4 image
        run: sudo ./os/build-image.sh pi4

      - name: Build Pi 5 image
        run: sudo ./os/build-image.sh pi5

      - name: Generate checksums
        run: |
          cd os
          sha256sum autobutler-pi4.img.xz autobutler-pi5.img.xz > SHA256SUMS-pi.txt
          cat SHA256SUMS-pi.txt

      - name: Attach images to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            os/autobutler-pi4.img.xz \
            os/autobutler-pi5.img.xz \
            os/SHA256SUMS-pi.txt \
            --clobber
