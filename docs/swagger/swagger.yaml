definitions:
  serverutil.ContentType:
    enum:
    - text/html
    - application/json
    type: string
    x-enum-varnames:
    - ContentTypeHTML
    - ContentTypeJSON
  serverutil.Response:
    properties:
      contentType:
        $ref: '#/definitions/serverutil.ContentType'
      data: {}
      error: {}
      statusCode:
        type: integer
    type: object
  storageutil.BackupToDeviceParams:
    properties:
      sourceDeviceSerial:
        type: string
      targetDeviceSerial:
        type: string
    type: object
  updateutil.UpdateSource:
    properties:
      account:
        type: string
      kind:
        $ref: '#/definitions/updateutil.UpdateSourceKind'
      path:
        type: string
    type: object
  updateutil.UpdateSourceKind:
    enum:
    - azure
    - github
    type: string
    x-enum-varnames:
    - UpdateSourceKindAzure
    - UpdateSourceKindGithub
  updateutil.UpdateVersion:
    properties:
      url:
        type: string
      version:
        type: string
    type: object
  v1_albums.AlbumItemJSON:
    properties:
      addedAt:
        type: string
      albumId:
        type: integer
      deviceSerial:
        type: string
      id:
        type: integer
      relPath:
        type: string
    type: object
  v1_albums.AlbumJSON:
    properties:
      children:
        items:
          $ref: '#/definitions/v1_albums.AlbumJSON'
        type: array
      createdAt:
        type: string
      id:
        type: integer
      itemCount:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      smartType:
        type: string
      updatedAt:
        type: string
    type: object
  v1_albums.addPhotoRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v1_albums.createAlbumRequest:
    properties:
      name:
        type: string
      parentId:
        type: integer
    required:
    - name
    type: object
  v1_albums.moveAlbumRequest:
    properties:
      parentId:
        type: integer
    type: object
  v1_albums.renameAlbumRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  v1_books.BookJSON:
    properties:
      fileName:
        type: string
      mtime:
        type: integer
      relPath:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
  v1_favorites.favoriteItemJSON:
    properties:
      createdAt:
        type: string
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v1_favorites.favoriteRequest:
    properties:
      deviceSerial:
        type: string
      relPath:
        type: string
    type: object
  v1_favorites.favoriteResponse:
    properties:
      isFavorite:
        type: boolean
    type: object
  v1_files.FileNodeJSON:
    properties:
      compressedSize:
        type: integer
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      dirPath:
        description: Directory path containing the file, for easier client-side handling
        type: string
      fileType:
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      name:
        type: string
      size:
        type: integer
    type: object
  v1_files.FileNodeWithTimeJSON:
    properties:
      compressedSize:
        type: integer
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      dirPath:
        description: Directory path containing the file, for easier client-side handling
        type: string
      fileType:
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      modifiedAt:
        type: string
      name:
        type: string
      size:
        type: integer
    type: object
  v1_files.StatFileJSON:
    properties:
      fileType:
        type: string
      isDir:
        type: boolean
      name:
        type: string
    type: object
  v1_files.moveFileRequest:
    properties:
      newDeviceSerial:
        type: string
      newFilePath:
        type: string
      oldDeviceSerial:
        type: string
      oldFilePath:
        type: string
    type: object
  v1_health.HealthJSON:
    properties:
      alerts:
        items:
          type: string
        type: array
      cpuCoreCount:
        type: integer
      cpuCorePercents:
        items:
          type: number
        type: array
      cpuPercent:
        type: number
      diskPercent:
        type: number
      diskTotalBytes:
        type: integer
      diskUsedBytes:
        type: integer
      healthy:
        type: boolean
      hostname:
        description: |-
          Hostname is the OS hostname of the butler device.
          Clients can use this to display accurate LAN mount paths (e.g. smb://hostname.local).
        type: string
      memPercent:
        type: number
      memTotalBytes:
        type: integer
      memUsedBytes:
        type: integer
      temperatureCelsius:
        type: number
    type: object
  v1_migration.StartImportRequest:
    properties:
      deviceSerial:
        description: 'Optional: empty string for internal drive'
        type: string
      email:
        description: User's Google email
        type: string
      services:
        properties:
          calendar:
            description: 'UNUSED: calendar migration is not yet implemented (see #856)'
            type: boolean
          contacts:
            type: boolean
          drive:
            type: boolean
          photos:
            type: boolean
        type: object
    type: object
  v1_photos.AlbumRefJSON:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  v1_photos.ExifJSON:
    properties:
      aperture:
        type: number
      dateTaken:
        type: string
      focalLength:
        type: number
      iso:
        type: integer
      latitude:
        type: number
      lens:
        type: string
      longitude:
        type: number
      make:
        type: string
      model:
        type: string
      shutterSpeed:
        type: string
    type: object
  v1_photos.PaginatedPhotosResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      photos:
        items:
          $ref: '#/definitions/v1_photos.PhotoJSON'
        type: array
      total:
        type: integer
    type: object
  v1_photos.PhotoJSON:
    properties:
      fileName:
        type: string
      hasLiveVideo:
        type: boolean
      mtime:
        type: integer
      relPath:
        type: string
      serial:
        type: string
      size:
        type: integer
    type: object
  v1_photos.PhotoMetadataJSON:
    properties:
      albums:
        items:
          $ref: '#/definitions/v1_photos.AlbumRefJSON'
        type: array
      exif:
        $ref: '#/definitions/v1_photos.ExifJSON'
      fileName:
        type: string
      fileSize:
        type: integer
      height:
        type: integer
      isFavorite:
        type: boolean
      livePhotoVideoPath:
        type: string
      mtime:
        type: integer
      rotationQuarters:
        type: integer
      width:
        type: integer
    type: object
  v1_photos.copyPhotoRequest:
    properties:
      relPath:
        type: string
      serial:
        type: string
    required:
    - relPath
    type: object
  v1_photos.copyPhotoResponse:
    properties:
      relPath:
        type: string
    type: object
  v1_photos.rotatePhotoRequest:
    properties:
      relPath:
        type: string
      rotationQuarters:
        description: 0–3; 0 deletes the record
        type: integer
      serial:
        type: string
    required:
    - relPath
    type: object
  v1_settings.SettingsJSON:
    properties:
      autoUpdate:
        type: boolean
    type: object
  v1_version.SbomDependencyJSON:
    properties:
      path:
        type: string
      replace:
        $ref: '#/definitions/v1_version.SbomDependencyJSON'
      sum:
        type: string
      version:
        type: string
    type: object
  v1_version.SbomJSON:
    properties:
      dependencies:
        items:
          $ref: '#/definitions/v1_version.SbomDependencyJSON'
        type: array
      goVersion:
        type: string
      main:
        $ref: '#/definitions/v1_version.SbomModuleJSON'
    type: object
  v1_version.SbomModuleJSON:
    properties:
      path:
        type: string
      sum:
        type: string
      version:
        type: string
    type: object
  v1_version.UpdateParams:
    properties:
      force:
        type: boolean
      source:
        $ref: '#/definitions/updateutil.UpdateSource'
      version:
        type: string
    type: object
  v1_version.UpdateRequest:
    properties:
      version:
        type: string
    type: object
  v1_version.VersionJSON:
    properties:
      buildDate:
        type: string
      gitCommit:
        type: string
      goVersion:
        type: string
      semver:
        type: string
    type: object
info:
  contact: {}
paths:
  /albums:
    get:
      description: Returns all photo albums as a flat list. Use ?tree=true to get
        a nested tree.
      parameters:
      - description: Return as nested tree (default false)
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_albums.AlbumJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all photo albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Creates a new photo album, optionally nested under a parent.
      parameters:
      - description: Album name and optional parent ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_albums.createAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a photo album
      tags:
      - albums
  /albums/{id}:
    delete:
      description: Deletes an album and all its children (cascades). Does not delete
        photos from disk.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete a photo album
      tags:
      - albums
    get:
      description: Returns a single album with its item count and direct children.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get a photo album by ID
      tags:
      - albums
  /albums/{id}/children:
    post:
      consumes:
      - application/json
      description: Shorthand for creating an album with a specific parent ID.
      parameters:
      - description: Parent album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_albums.createAlbumRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a child album under a parent
      tags:
      - albums
  /albums/{id}/items:
    delete:
      consumes:
      - application/json
      description: Removes the album membership pointer. Does not delete the photo
        from disk.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_albums.addPhotoRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Remove a photo from an album
      tags:
      - albums
    get:
      description: Returns all photo items (pointers) in the given album.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_albums.AlbumItemJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List photos in an album
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Adds a photo (by device serial + relative path) to an album. Idempotent.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo reference
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_albums.addPhotoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1_albums.AlbumItemJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Add a photo to an album
      tags:
      - albums
  /albums/{id}/move:
    patch:
      consumes:
      - application/json
      description: Changes the parent of an album. Pass null parentId to move to root.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New parent ID (null for root)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_albums.moveAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move a photo album to a new parent
      tags:
      - albums
  /albums/{id}/rename:
    patch:
      consumes:
      - application/json
      description: Updates the name of an existing album.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: New album name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_albums.renameAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_albums.AlbumJSON'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Rename a photo album
      tags:
      - albums
  /auth/google/authorize:
    get:
      description: Returns an authorization URL and state token for starting OAuth
        flow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get Google authorization URL
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Callback endpoint used by Google OAuth. Exchanges code for token
        and returns HTML.
      parameters:
      - description: OAuth state token
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Google OAuth callback
      tags:
      - auth
  /auth/google/disconnect:
    post:
      consumes:
      - application/json
      description: Removes stored Google OAuth token for a user (or all tokens if
        no email provided)
      parameters:
      - description: '{email: string}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Disconnect Google account
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates with username and password, returns a session token
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Invalidates the current session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Logout
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: Resets password using recovery phrase
      parameters:
      - description: '{recoveryPhrase, newPassword}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Recover account
      tags:
      - auth
  /auth/setup:
    post:
      consumes:
      - application/json
      description: Creates the owner account. Can only be called once.
      parameters:
      - description: '{username, password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: First-boot user setup
      tags:
      - auth
  /auth/status:
    get:
      description: Returns whether initial setup has been completed
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Check auth setup status
      tags:
      - auth
  /books:
    get:
      description: Finds all books in the cirrus directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_books.BookJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List books
      tags:
      - books
  /cirrus:
    delete:
      description: Enqueue deletion of files under the specified root directory
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete files
      tags:
      - cirrus
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Lists files
      tags:
      - cirrus
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Ok
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move or rename a file
      tags:
      - cirrus
  /cirrus/by-type:
    get:
      description: Recursively walks all managed devices and returns files whose fileType
        matches the given value, sorted newest-first.
      parameters:
      - description: File type to filter by (e.g. abdoc, absheet)
        in: query
        name: fileType
        required: true
        type: string
      - collectionFormat: csv
        description: Filter by device serial(s)
        in: query
        items:
          type: string
        name: serial
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_files.FileNodeWithTimeJSON'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List all files of a given type
      tags:
      - cirrus
  /cirrus/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
