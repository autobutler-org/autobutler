definitions:
  serverutil.ContentType:
    enum:
    - text/html
    - application/json
    type: string
    x-enum-varnames:
    - ContentTypeHTML
    - ContentTypeJSON
  serverutil.Response:
    properties:
      contentType:
        $ref: '#/definitions/serverutil.ContentType'
      data: {}
      error: {}
      statusCode:
        type: integer
    type: object
  updateutil.UpdateParams:
    properties:
      baseUpdateURL:
        type: string
      version:
        type: string
    type: object
  v1_books.BookJSON:
    properties:
      fileName:
        type: string
      mtime:
        type: integer
      relPath:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
  v1_files.FileNodeJSON:
    properties:
      deviceName:
        type: string
      devicePath:
        type: string
      deviceSerial:
        type: string
      fullPath:
        type: string
      isDir:
        type: boolean
      name:
        type: string
      size:
        type: integer
    type: object
  v1_files.moveFileRequest:
    properties:
      newDeviceSerial:
        type: string
      newFilePath:
        type: string
      oldDeviceSerial:
        type: string
      oldFilePath:
        type: string
    type: object
  v1_migration.StartImportRequest:
    properties:
      deviceSerial:
        description: 'Optional: empty string for internal drive'
        type: string
      email:
        description: User's Google email
        type: string
      services:
        properties:
          calendar:
            type: boolean
          contacts:
            type: boolean
          drive:
            type: boolean
          photos:
            type: boolean
        type: object
    type: object
  v1_photos.PhotoJSON:
    properties:
      fileName:
        type: string
      mtime:
        type: integer
      relPath:
        type: string
      size:
        type: integer
    type: object
  v1_version.ReleaseJSON:
    properties:
      htmlUrl:
        type: string
      isCurrentVersion:
        type: boolean
      name:
        type: string
      publishedAt:
        type: string
      tagName:
        type: string
    type: object
  v1_version.UpdateRequest:
    properties:
      version:
        type: string
    type: object
  v1_version.VersionJSON:
    properties:
      buildDate:
        type: string
      gitCommit:
        type: string
      goVersion:
        type: string
      semver:
        type: string
    type: object
info:
  contact: {}
paths:
  /auth/google/authorize:
    get:
      description: Returns an authorization URL and state token for starting OAuth
        flow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get Google authorization URL
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Callback endpoint used by Google OAuth. Exchanges code for token
        and returns HTML.
      parameters:
      - description: OAuth state token
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Google OAuth callback
      tags:
      - auth
  /auth/google/disconnect:
    post:
      consumes:
      - application/json
      description: Removes stored Google OAuth token for a user (or all tokens if
        no email provided)
      parameters:
      - description: '{email: string}'
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Disconnect Google account
      tags:
      - auth
  /books:
    get:
      description: Finds all books in the cirrus directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_books.BookJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List books
      tags:
      - books
  /cirrus:
    delete:
      description: Enqueue deletion of files under the specified root directory
      parameters:
      - description: Root directory
        in: query
        name: rootDir
        type: string
      - collectionFormat: csv
        description: Array of file paths to delete
        in: query
        items:
          type: string
        name: filePaths
        required: true
        type: array
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Delete files
      tags:
      - cirrus
    get:
      description: merges files across all managed devices for the given filePath.
        If deviceSerial is empty, list files across all devices. Otherwise, only for
        the specified device
      parameters:
      - description: File dir to list
        in: query
        name: rootDir
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_files.FileNodeJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Lists files
      tags:
      - cirrus
    put:
      consumes:
      - application/json
      description: Enqueue a file move operation between paths/devices
      parameters:
      - description: Move file request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_files.moveFileRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Move or rename a file
      tags:
      - cirrus
  /cirrus//upload/{rootDir}:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data
      parameters:
      - description: Directory to upload into
        in: path
        name: rootDir
        required: true
        type: string
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Upload files to a nested directory
      tags:
      - cirrus
  /cirrus/download:
    get:
      description: Downloads a single file or zips a folder and streams it back to
        the client
      parameters:
      - description: File path to download
        in: query
        name: filePath
        type: string
      - description: Device serial number to filter by
        in: query
        name: serial
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Download a file or folder
      tags:
      - cirrus
  /cirrus/folder/{folderDir}:
    post:
      consumes:
      - multipart/form-data
      description: Enqueue create-folder operation under the given folder directory
      parameters:
      - description: Folder directory
        in: path
        name: folderDir
        required: true
        type: string
      - description: Name of the new folder
        in: formData
        name: folderName
        required: true
        type: string
      - description: Device serial number to create folder on
        in: query
        name: serial
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Create a new folder
      tags:
      - cirrus
  /cirrus/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload one or more files via multipart/form-data
      parameters:
      - description: Device serial number to upload to
        in: query
        name: serial
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/serverutil.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Upload files to the top-level directory
      tags:
      - cirrus
  /migration/google/start:
    post:
      consumes:
      - application/json
      description: Starts an import job for selected Google services for the given
        email
      parameters:
      - description: Start import request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1_migration.StartImportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Start Google import/migration
      tags:
      - migration
  /migration/google/status/{jobId}:
    get:
      description: Returns the status of a previously started import job
      parameters:
      - description: Job ID
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get Google import job status
      tags:
      - migration
  /photos:
    get:
      description: Finds all photos in cirrus
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_photos.PhotoJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List photos
      tags:
      - photos
  /storage/devices/status:
    get:
      description: Returns statuses for all known storage devices
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List storage device statuses
      tags:
      - storage
  /storage/devices/status/{serial}:
    get:
      description: Returns status for a single storage device identified by serial
      parameters:
      - description: Device serial
        in: path
        name: serial
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get storage device status by serial
      tags:
      - storage
  /storage/devices/usb/{serial}:
    delete:
      description: Unmounts a USB storage device identified by serial
      parameters:
      - description: Device serial
        in: path
        name: serial
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Disable (unmount) a USB storage device
      tags:
      - storage
    post:
      description: Mounts a USB storage device identified by serial and returns mount
        info
      parameters:
      - description: Device serial
        in: path
        name: serial
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Enable (mount) a USB storage device
      tags:
      - storage
  /version:
    get:
      description: Retrieves the installed version of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_version.VersionJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get installed version
      tags:
      - version
  /version/available:
    get:
      description: Lists all available versions for update
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/v1_version.ReleaseJSON'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: List available versions
      tags:
      - version
  /version/latest:
    get:
      description: Retrieves the latest available version of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_version.ReleaseJSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Get latest version
      tags:
      - version
    post:
      description: Finds and installs the latest version
      parameters:
      - description: Base URL for updates
        in: query
        name: baseUpdateURL
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_version.UpdateRequest'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Update to the latest version
      tags:
      - version
  /version/update:
    post:
      consumes:
      - application/json
      description: Performs an update to the specified version
      parameters:
      - description: Update Request
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/updateutil.UpdateParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1_version.UpdateRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/serverutil.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/serverutil.Response'
      summary: Perform update
      tags:
      - version
swagger: "2.0"
