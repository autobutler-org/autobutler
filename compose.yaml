# Local development only: the PostgreSQL instance `make serve/postgres` starts and
# DB_BACKEND=postgres points at. See docs/architecture/postgres-dev.md.
#
# The credentials are throwaway and the port is bound to loopback. Nothing here is for
# production: docs/container.md covers running Quark itself in a container.
#
# The name is fixed so the network (quark_default) and the volume (quark_postgres) are
# called the same from every checkout and worktree; the Makefile relies on both.
name: quark

services:
  postgres:
    # Pinned to a major so Renovate moves it: the default inside ${POSTGRES_IMAGE:-...} is
    # the pin, and the only place the tag is written. Set POSTGRES_IMAGE (environment, .env
    # or the make command line) to run another one. pg_trgm ships in this image; the migration
    # that adds filename search enables it, so there is no init script to keep in step.
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_USER: quark
      POSTGRES_PASSWORD: quark
      POSTGRES_DB: quark
      # Set rather than left to the image, whose default moved in 18. It must not be
      # /var/lib/postgresql/data: 17 and older declare that path an anonymous volume, which
      # would shadow the named one, and 18 refuses to start with anything mounted there.
      PGDATA: /var/lib/postgresql/pgdata
    ports:
      # The Makefile exports POSTGRES_PORT, so its URL and check/db follow the same value.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quark -d quark"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres:
