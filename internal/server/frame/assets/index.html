<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070D19" />
    <title>Quark Frame</title>
    <link rel="manifest" href="/frame/manifest.webmanifest" />
    <link rel="stylesheet" href="/frame/frame.css" />
  </head>
  <body>
    <main id="app">
      <section id="signin" class="panel" hidden>
        <svg class="mark" viewBox="0 0 24 24" aria-label="Quark" role="img"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <h1>Welcome back</h1>
        <p class="lead">Sign in to your Quark.</p>
        <form id="signin-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button id="signin-button" type="submit">Sign in</button>
        </form>
      </section>

      <section id="chooser" class="panel" hidden>
        <svg class="mark" viewBox="0 0 24 24" aria-label="Quark" role="img"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <h1>Choose an album</h1>
        <p class="lead">It plays on this screen as a slideshow.</p>
        <ul id="albums"></ul>
        <button id="chooser-signout" type="button" class="quiet">Sign out</button>
      </section>

      <section id="show" hidden>
        <img id="layer-a" alt="" />
        <img id="layer-b" alt="" />
        <div id="menu" hidden>
          <button id="menu-albums" type="button">Albums</button>
          <button id="menu-fullscreen" type="button">Full screen</button>
          <button id="menu-signout" type="button">Sign out</button>
          <button id="menu-close" type="button" class="primary">Close</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <noscript>This page needs JavaScript.</noscript>
    <script src="/frame/frame.js"></script>
  </body>
</html>
